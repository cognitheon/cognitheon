[package]
name = "cognitheon"
version = "0.1.0"
authors = ["dyzdyz010 <dyzdyz010@gmail.com>"]
edition = "2021"
# 仓库有 cognitheon(GUI) 与 headless(CLI) 两个 bin；指定 `cargo run` 默认跑 GUI
default-run = "cognitheon"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = { version = "0.34", features = ["serde"] }
eframe = { version = "0.34", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    # "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence", # Enable restoring app state when restarting the app.
    "wayland",     # To support Linux (and CI)
    "wgpu",        # Use the wgpu rendering backend. Alternative: "glow".
] }
log = "0.4"

typetag = "0.2"

# You only need serde if you want app persistence:
serde = { version = "1", features = ["derive"] }

petgraph = { version = "0.8", features = ["serde-1"] }
bytemuck = "1.25"
rand = "0.10"
rfd = "0.17"
serde_json = "1.0"
egui_commonmark = { version = "0.23", default-features = false }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
# tokio 仅用于 native 的文件对话框 block_on；其 net 特性依赖 mio，不支持 wasm32
tokio = { version = "1", features = ["full"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.77"           # 导出/导入用：Uint8Array / Array（Blob 构造与 FileReader 结果转换）
# to access the DOM：隐藏 loading text + 导出下载（Blob/Url/<a>）+ 导入（<input>/FileReader）
web-sys = { version = "0.3.77", features = [
    "Blob",
    "BlobPropertyBag",
    "Url",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlInputElement",
] }
getrandom = { version = "0.4", features = ["wasm_js"] }

# [target.'cfg(target_arch = "wasm32")']
# rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2


[patch.crates-io]

# If you want to use the bleeding edge version of egui and eframe:
# egui = { git = "https://github.com/emilk/egui", branch = "master" }
# eframe = { git = "https://github.com/emilk/egui", branch = "master" }

# If you fork https://github.com/emilk/egui you can test with:
# egui = { path = "../egui/crates/egui" }
# eframe = { path = "../egui/crates/eframe" }
